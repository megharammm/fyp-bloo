[package]
name = "bloo_api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
askama = "0.16.1"
axum = { version = "0.8", features = ["multipart"] }
bloo_core = { version = "0.1.0", path = "../bloo-core" }
bloo_ingest = { version = "0.1.0", path = "../bloo-ingest" }
bloo_parse = { version = "0.1.0", path = "../bloo-parse" }
bloo_rag = { version = "0.1.0", path = "../bloo-rag" }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate"] }
tokio.workspace = true
tower-http = { version = "0.7.1", features = ["trace", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1.29.0", features = ["v4", "serde"] }
