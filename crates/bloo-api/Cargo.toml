[package]
name = "bloo_api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
askama = "0.16.1"
axum = "0.8.9"
bloo_core = { version = "0.1.0", path = "../bloo-core" }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate"] }
tokio.workspace = true
tower-http = { version = "0.7.1", features = ["trace", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
