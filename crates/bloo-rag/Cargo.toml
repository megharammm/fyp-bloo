[package]
name = "bloo_rag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1.92"
bloo_core = { version = "0.1.0", path = "../bloo-core" }
bloo_parse = { version = "0.1.0", path = "../bloo-parse" }
fastembed = "6.1.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "http2", "charset", "stream"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate"] }
tokio.workspace = true
tokio-stream = "0.1.19"
uuid = { version = "1.20.0", features = ["v4", "serde"] }

